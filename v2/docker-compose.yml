version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pme-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pme_ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-pme_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - pme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pme_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: pme-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - pme-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IA Locale (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: pme-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - pme-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0

  # Backend API Principal
  backend-api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: pme-backend-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pme_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pme_ai_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      OLLAMA_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    volumes:
      - ./backend/api:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - pme-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # Serveur MCP (IA-to-IA)
  mcp-server:
    build:
      context: ./backend/mcp-server
      dockerfile: Dockerfile
    container_name: pme-mcp-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pme_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pme_ai_platform}
      OLLAMA_URL: http://ollama:11434
      MCP_PORT: 5001
      COMPANY_ID: ${COMPANY_ID}
    volumes:
      - ./backend/mcp-server:/app
      - /app/node_modules
    ports:
      - "5001:5001"
    networks:
      - pme-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # Analytics Engine
  analytics:
    build:
      context: ./backend/analytics
      dockerfile: Dockerfile
    container_name: pme-analytics
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pme_admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pme_ai_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
    volumes:
      - ./backend/analytics:/app
      - /app/node_modules
    networks:
      - pme-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend - Site Creator
  frontend-site-creator:
    build:
      context: ./frontend/site-creator
      dockerfile: Dockerfile
    container_name: pme-frontend-site-creator
    environment:
      VITE_API_URL: http://backend-api:5000
    volumes:
      - ./frontend/site-creator:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - pme-network
    depends_on:
      - backend-api
    restart: unless-stopped

  # Frontend - Catalog Manager
  frontend-catalog:
    build:
      context: ./frontend/catalog-manager
      dockerfile: Dockerfile
    container_name: pme-frontend-catalog
    environment:
      VITE_API_URL: http://backend-api:5000
    volumes:
      - ./frontend/catalog-manager:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    networks:
      - pme-network
    depends_on:
      - backend-api
    restart: unless-stopped

  # Frontend - Identity Manager
  frontend-identity:
    build:
      context: ./frontend/identity-manager
      dockerfile: Dockerfile
    container_name: pme-frontend-identity
    environment:
      VITE_API_URL: http://backend-api:5000
    volumes:
      - ./frontend/identity-manager:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    networks:
      - pme-network
    depends_on:
      - backend-api
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pme-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - pme-network
    depends_on:
      - frontend-site-creator
      - frontend-catalog
      - frontend-identity
      - backend-api
      - mcp-server
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  uploads_data:
    driver: local

networks:
  pme-network:
    driver: bridge
